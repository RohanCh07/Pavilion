# Render Blueprint: New > Blueprint > pick this repo. Creates the web app on Render's free
# plan. The database is a free Neon Postgres (neon.tech): paste its connection string as
# DATABASE_URL when Render asks (a plain postgres:// or postgresql:// URL is fine).
# The Telegram bot isn't included: a free web service sleeps, so it can't watch live
# matches. Run the bot on an always-on machine instead (see docs/DEPLOY.md).

services:
  - type: web
    name: pavilion
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATA_PROVIDER
        value: crex
      - key: DATABASE_URL
        sync: false
      - key: CREX_SERIES
        sync: false
      - key: LOG_LEVEL
        value: INFO
